name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "Error: tag ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD)) is not an ancestor of origin/master"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Pre-release verification gate (gofmt, go vet, go test)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v ./...

      - name: Cross-compile and package release archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist

          targets=(
            "linux:amd64"
            "linux:arm64"
            "darwin:amd64"
            "darwin:arm64"
            "windows:amd64"
            "windows:arm64"
          )

          for target in "${targets[@]}"; do
            GOOS="${target%%:*}"
            GOARCH="${target##*:}"
            STAGE="stage/hunks_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "${STAGE}"

            BIN="hunks"
            if [ "${GOOS}" = "windows" ]; then
              BIN="hunks.exe"
            fi

            echo "Building ${GOOS}/${GOARCH} -> ${STAGE}/${BIN}"
            GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${STAGE}/${BIN}" ./cmd/hunks

            cp README.md MANUAL.md "${STAGE}/"

            if [ "${GOOS}" = "windows" ]; then
              (cd "${STAGE}" && zip -q "../../dist/hunks_${VERSION}_${GOOS}_${GOARCH}.zip" "${BIN}" README.md MANUAL.md)
            else
              tar -C "${STAGE}" -czf "dist/hunks_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "${BIN}" README.md MANUAL.md
            fi
          done

          (cd dist && sha256sum hunks_* > checksums.txt)
          ls -lh dist/
          cat dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
